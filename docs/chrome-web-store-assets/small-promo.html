<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=440, initial-scale=1" />
    <title>Scrobble Bridge small promo tile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background:
          radial-gradient(
            circle at 88% 12%,
            rgba(105, 214, 173, 0.25),
            transparent 38%
          ),
          linear-gradient(135deg, #10281f, #145f47);
        color: #f7fff9;
        display: grid;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        height: 280px;
        overflow: hidden;
        padding: 34px 38px;
        width: 440px;
      }
      .top {
        align-items: center;
        display: flex;
        gap: 15px;
      }
      .mark {
        align-items: center;
        background: #f7fff9;
        border-radius: 14px;
        color: #145f47;
        display: flex;
        height: 52px;
        justify-content: center;
        width: 52px;
      }
      .mark svg {
        height: 34px;
        width: 34px;
      }
      strong {
        font-size: 24px;
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: 33px;
        letter-spacing: -0.045em;
        line-height: 1.08;
        margin: 27px 0 10px;
      }
      p {
        color: #cde5d9;
        font-size: 15px;
        line-height: 1.35;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 36 36">
          <path
            d="M4 18c3.1-7.2 6.2-7.2 9.3 0s6.2 7.2 9.3 0 6.2-7.2 9.3 0"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="4"
          />
        </svg>
      </div>
      <strong>Scrobble Bridge</strong>
    </div>
    <h1>YouTube Music → Last.fm</h1>
    <p>Private, local-first credential refresh for your desktop or NAS.</p>
  </body>
</html>
