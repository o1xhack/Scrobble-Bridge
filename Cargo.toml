[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/scrobble-core",
    "crates/scrobble-engine",
    "crates/scrobble-storage",
    "crates/ytmusic-client",
    "crates/lastfm-client",
    "crates/scrobble-daemon",
    "crates/scrobble-ipc",
    "crates/scrobble-keyring",
    "crates/native-host",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/o1xhack/Scrobble-Bridge"
authors = ["Scrobble Bridge contributors"]

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
hmac = "0.13.0"
interprocess = "2.4.3"
keyring = "4.1.6"
md-5 = "0.11.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
needless_raw_string_hashes = "allow"
