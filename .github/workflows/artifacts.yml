name: Desktop and extension artifacts

on:
  workflow_dispatch:
    inputs:
      lastfm_application:
        description: "Last.fm application mode for desktop installers"
        required: true
        default: bundled
        type: choice
        options:
          - bundled
          - self-provided

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: aarch64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      SCROBBLE_LASTFM_API_KEY: ${{ secrets.SCROBBLE_LASTFM_API_KEY }}
      SCROBBLE_LASTFM_SHARED_SECRET: ${{ secrets.SCROBBLE_LASTFM_SHARED_SECRET }}
      SCROBBLE_PRODUCTION_EXTENSION_ID: ${{ vars.SCROBBLE_PRODUCTION_EXTENSION_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_MAC_RELEASE_CREDENTIALS: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Verify bundled Last.fm application is configured
        if: inputs.lastfm_application == 'bundled'
        shell: bash
        run: |
          test -n "$SCROBBLE_LASTFM_API_KEY" && test -n "$SCROBBLE_LASTFM_SHARED_SECRET" || {
            echo "Configure both SCROBBLE_LASTFM_API_KEY and SCROBBLE_LASTFM_SHARED_SECRET repository secrets."
            exit 1
          }
      - uses: apple-actions/import-codesign-certs@v7
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scrobble-bridge/desktop bundle:mac
      - name: Verify Tauri updater signature
        shell: bash
        run: |
          node -p "require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey" > "$RUNNER_TEMP/updater.pub"
          artifact=$(find target/release/bundle/updater -name '*.app.tar.gz' -print -quit)
          test -n "$artifact"
          cargo run -p scrobble-bridge-desktop --example verify-updater-artifact -- "$artifact" "$artifact.sig" "$RUNNER_TEMP/updater.pub"
      - name: Notarize and staple
        if: env.HAS_MAC_RELEASE_CREDENTIALS == 'true'
        run: |
          dmg_path=$(find target/release/bundle/dmg -name "*_${{ matrix.architecture }}.dmg" -print -quit)
          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg_path"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage macOS release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp target/release/bundle/dmg/*.dmg release-assets/
          cp target/release/bundle/updater/* release-assets/
          (cd release-assets && shasum -a 256 ./*.dmg ./*.app.tar.gz ./*.sig > checksums-${{ matrix.architecture }}.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: scrobble-bridge-macos-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      SCROBBLE_LASTFM_API_KEY: ${{ secrets.SCROBBLE_LASTFM_API_KEY }}
      SCROBBLE_LASTFM_SHARED_SECRET: ${{ secrets.SCROBBLE_LASTFM_SHARED_SECRET }}
      SCROBBLE_PRODUCTION_EXTENSION_ID: ${{ vars.SCROBBLE_PRODUCTION_EXTENSION_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Verify bundled Last.fm application is configured
        if: inputs.lastfm_application == 'bundled'
        shell: bash
        run: |
          test -n "$SCROBBLE_LASTFM_API_KEY" && test -n "$SCROBBLE_LASTFM_SHARED_SECRET" || {
            echo "Configure both SCROBBLE_LASTFM_API_KEY and SCROBBLE_LASTFM_SHARED_SECRET repository secrets."
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - name: Import Windows signing certificate
        if: env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "scrobble-bridge-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          Remove-Item $pfx -Force
      - name: Build signed Windows installer
        if: env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $overlay = @{ bundle = @{ windows = @{ certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT } } } | ConvertTo-Json -Compress -Depth 4
          pnpm --filter @scrobble-bridge/desktop tauri build --bundles nsis --config src-tauri/tauri.release.conf.json --config $overlay
      - name: Build unsigned Windows installer
        if: env.HAS_WINDOWS_CERTIFICATE != 'true'
        run: pnpm --filter @scrobble-bridge/desktop tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Verify Windows signatures
        if: env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($files.Count -eq 0) { throw "No NSIS installer was generated" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne "Valid") { throw "Invalid signature on $($file.Name): $($signature.Status)" }
          }
      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { throw "No NSIS installer was generated" }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName release-assets/
            $signature = "$($installer.FullName).sig"
            if (Test-Path $signature) { Copy-Item $signature release-assets/ }
          }
          $installers | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content release-assets/checksums-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: scrobble-bridge-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scrobble-bridge/extension package:store
      - uses: actions/upload-artifact@v7
        with:
          name: scrobble-bridge-chrome-extension
          path: target/scrobble-bridge-extension-*.zip
          if-no-files-found: error

  updater-manifest:
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: scrobble-bridge-macos-*
          path: release-assets
          merge-multiple: true
      - name: Generate signed static updater manifest
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          node apps/desktop/scripts/generate-updater-manifest.mjs \
            --version "$version" \
            --output release-assets/latest.json \
            --platform "darwin-aarch64=release-assets/Scrobble Bridge_${version}_aarch64.app.tar.gz" \
            --platform "darwin-x86_64=release-assets/Scrobble Bridge_${version}_x86_64.app.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: scrobble-bridge-updater-manifest
          path: |
            release-assets/latest.json
            docs/releases/*.md
          if-no-files-found: error
