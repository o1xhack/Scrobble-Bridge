name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --exclude scrobble-bridge-desktop
      - run: cargo clippy --workspace --all-targets --exclude scrobble-bridge-desktop -- -D warnings

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --target x86_64-unknown-linux-gnu --exclude scrobble-bridge-desktop
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --target aarch64-apple-darwin
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --target x86_64-pc-windows-msvc

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  desktop-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scrobble-bridge/desktop build:tauri-assets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
