[package]
name = "scrobble-bridge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "scrobble_bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono.workspace = true
directories.workspace = true
interprocess.workspace = true
lastfm-client = { version = "1.0.0", path = "../../../crates/lastfm-client" }
scrobble-daemon = { version = "1.0.0", path = "../../../crates/scrobble-daemon" }
scrobble-core = { version = "1.0.0", path = "../../../crates/scrobble-core" }
scrobble-ipc = { version = "1.0.0", path = "../../../crates/scrobble-ipc" }
scrobble-keyring = { version = "1.0.0", path = "../../../crates/scrobble-keyring" }
scrobble-engine = { version = "1.0.0", path = "../../../crates/scrobble-engine" }
scrobble-storage = { version = "1.0.0", path = "../../../crates/scrobble-storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.4"
tokio.workspace = true
tracing.workspace = true
ytmusic-client = { version = "1.0.0", path = "../../../crates/ytmusic-client" }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
